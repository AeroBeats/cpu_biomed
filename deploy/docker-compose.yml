name: cpubiomed

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      # 启用 HTTPS 后取消注释，并把 ./nginx/certbot 目录挂到宿主机
      # - "443:443"
    volumes:
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      # 题库配图由 nginx 直接发，不经过 api（只读挂载，nginx 改不了图）
      - mediadata:/var/www/media:ro
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [front]

  api:
    build: ./server
    restart: unless-stopped
    # 故意不写 ports：题库接口只能经 nginx 到达，不单独暴露在公网。
    environment:
      PORT: "8080"
      SITE_ROOT: /app/site
      # 题库配图的存放位置，nginx 以只读方式挂同一个卷来对外发图
      MEDIA_DIR: /app/media
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # 留空则由服务从 ADMIN_PASSWORD 派生会话密钥
      SESSION_SECRET: ${SESSION_SECRET:-}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      # 前端静态文件直接复用仓库里的 web/，改内容不用重新构建镜像
      - ../web:/app/site:ro
      # 配图要能写，所以是独立的可写卷，跟着备份走
      - mediadata:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [front, back]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # 同样不写 ports：数据库只在 compose 内网可达。
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [back]

volumes:
  dbdata:
  mediadata:

networks:
  front:
  back:
